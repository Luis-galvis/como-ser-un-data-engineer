# docker-compose.yml
# Entorno local reproducible y determinista para los laboratorios de 'Cómo ser un Data Engineer'
# Compatible con Docker Compose v2+ (sin directiva 'version' obsoleta)

services:
  # ---------------------------------------------------------------------------
  # 1. Base Relacional OLTP (Capítulos 00B, 01, 17)
  # ---------------------------------------------------------------------------
  postgres:
    image: postgres:16-alpine
    container_name: de_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres_secure_pass_2026}
      POSTGRES_DB: ${POSTGRES_DB:-data_engineer_db}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres}"]
      interval: 5s
      timeout: 5s
      retries: 5

  # ---------------------------------------------------------------------------
  # 2. Almacenamiento de Objetos S3 Local / Data Lake (Capítulos 07, 18, 34)
  # ---------------------------------------------------------------------------
  minio:
    image: minio/minio:RELEASE.2024-10-13T13-34-11Z
    container_name: de_minio
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-admin_minio}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-minio_secret_key_2026}
    ports:
      - "9000:9000"   # S3 API Endpoint
      - "9001:9001"   # Consola Web UI
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 5s
      retries: 5

  # ---------------------------------------------------------------------------
  # 3. Inicializador de Buckets Medallón (Bronze, Silver, Gold)
  # ---------------------------------------------------------------------------
  minio-init:
    image: minio/mc:RELEASE.2024-10-08T09-37-26Z
    container_name: de_minio_init
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "
      /usr/bin/mc alias set local http://minio:9000 ${MINIO_ROOT_USER:-admin_minio} ${MINIO_ROOT_PASSWORD:-minio_secret_key_2026};
      /usr/bin/mc mb --ignore-existing local/landing;
      /usr/bin/mc mb --ignore-existing local/bronze;
      /usr/bin/mc mb --ignore-existing local/silver;
      /usr/bin/mc mb --ignore-existing local/gold;
      echo 'Buckets Lakehouse inicializados exitosamente.';
      exit 0;
      "

  # ---------------------------------------------------------------------------
  # 4. Apache Spark Master (Capítulos 03 a 12, 18, 27)
  # ---------------------------------------------------------------------------
  spark-master:
    image: apache/spark:3.5.3
    container_name: de_spark_master
    restart: unless-stopped
    environment:
      - SPARK_MODE=master
      - SPARK_RPC_AUTHENTICATION_ENABLED=no
      - SPARK_RPC_ENCRYPTION_ENABLED=no
      - SPARK_LOCAL_STORAGE_ENCRYPTION_ENABLED=no
      - SPARK_SSL_ENABLED=no
    ports:
      - "8080:8080"   # Spark Master Web UI
      - "7077:7077"   # Spark Master RPC
    volumes:
      - ./data:/opt/spark/data
      - ./scripts:/opt/spark/scripts

  # ---------------------------------------------------------------------------
  # 5. Apache Spark Worker
  # ---------------------------------------------------------------------------
  spark-worker:
    image: apache/spark:3.5.3
    container_name: de_spark_worker
    restart: unless-stopped
    depends_on:
      - spark-master
    environment:
      - SPARK_MODE=worker
      - SPARK_MASTER_URL=spark://spark-master:7077
      - SPARK_WORKER_MEMORY=2G
      - SPARK_WORKER_CORES=2
    volumes:
      - ./data:/opt/spark/data
      - ./scripts:/opt/spark/scripts

volumes:
  postgres_data:
    name: de_postgres_data
  minio_data:
    name: de_minio_data

networks:
  default:
    name: de_network
