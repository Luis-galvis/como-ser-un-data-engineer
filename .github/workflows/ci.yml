name: CI Pipeline Reproducible

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  test-suite:
    name: Pruebas Automatizadas y Reproducibilidad
    runs-on: ubuntu-latest

    steps:
      - name: Clonar Repositorio
        uses: actions/checkout@v4

      - name: Configurar Python 3.12 (Versión Fijada)
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Instalar Dependencias Bloqueadas
        run: |
          python -m pip install --upgrade pip
          pip install duckdb==1.1.3 pyarrow==17.0.0 pydantic==2.9.2 pytest==8.3.3 ruff==0.7.1 httpx==0.27.2 loguru==0.7.2

      - name: Validar Estilo y Linting con Ruff
        run: |
          ruff check tests/ scripts/

      - name: Ejecutar Generador Determinista de Datasets
        run: |
          python scripts/generar_datos.py

      - name: Ejecutar Suite Completa con Pytest
        run: |
          pytest -v tests/
