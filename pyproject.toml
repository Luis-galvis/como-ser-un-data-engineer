[project]
name = "como-ser-un-data-engineer"
version = "1.0.0"
description = "Código de laboratorio, pipelines reproducibles, tests y suite de ejercicios del libro 'Cómo ser un Data Engineer'"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [
    { name = "Luis Galvis", email = "contacto@luisgalvis.dev" }
]
dependencies = [
    "pyarrow>=17.0.0",
    "duckdb>=1.1.0",
    "pydantic>=2.9.0",
    "httpx>=0.27.0",
    "loguru>=0.7.2",
    "pandas>=2.2.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3.0",
    "pytest-cov>=5.0.0",
    "ruff>=0.7.0",
    "mypy>=1.13.0",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I"]
ignore = ["E501"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
addopts = "-v --strict-markers"
