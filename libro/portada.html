    @page {
      size: 7in 10in;
      margin: 0;
    }

    :root {
      --ink: #1b2030;
      --grey: #4a5160;
      --paper: #fbf9f4;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0
    }

    html,
    body {
      background: #cfcfcf
    }

    body {
      font-family: 'EB', Georgia, serif;
      color: var(--ink)
    }

    .page {
      width: 7in;
      height: 10in;
      position: relative;
      overflow: hidden;
      background: var(--paper);
      margin: 0 auto 24px;
      page-break-after: always
    }

    @media print {

      html,
      body {
        background: none
      }

      .page {
        margin: 0
      }
    }

    .frame {
      position: absolute;
      inset: .42in;
      border: .75pt solid var(--ink)
    }

    .frame::after {
      content: "";
      position: absolute;
      inset: 4px;
      border: .25pt solid var(--ink)
    }

    .head {
      position: absolute;
      top: .85in;
      left: .75in;
      right: .75in;
      text-align: left
    }

    .pre {
      font-family: 'CG', serif;
      font-style: italic;
      font-weight: 500;
      font-size: 32pt;
      color: var(--grey);
      letter-spacing: .01em
    }

    h1 {
      font-family: 'CG', serif;
      font-weight: 700;
      font-size: 66pt;
      line-height: 1;
      letter-spacing: .005em;
      margin-top: .0in;
      margin-left: -.03in
    }

    .orn {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: .12in;
      margin: .2in 0 .18in
    }

    .orn i {
      display: block;
      width: 1.1in;
      height: .75pt;
      background: var(--ink)
    }

    .orn b {
      display: block;
      width: .07in;
      height: .07in;
      background: var(--ink);
      transform: rotate(45deg)
    }

    .sub {
      font-style: italic;
      font-size: 15.5pt;
      line-height: 1.38;
      color: var(--grey);
      max-width: 4.7in;
      margin: .28in 0 0 0
    }

    .art {
      position: absolute;
      left: .15in;
      right: .15in;
      top: 3.95in
    }

    .art img {
      width: 100%;
      display: block
    }

    .author {
      position: absolute;
      right: .75in;
      bottom: .7in;
      text-align: right;
      font-family: 'CG', serif;
